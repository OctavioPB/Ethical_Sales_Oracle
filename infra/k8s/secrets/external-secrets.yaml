# External Secrets Operator — syncs Vault secrets into K8s Secrets
# Requires: External Secrets Operator installed in the cluster.
# Install: https://external-secrets.io/latest/introduction/getting-started/
#
# These ExternalSecret objects pull credentials from Vault and create
# native K8s Secrets that are consumed by service Deployments.

# ── ClusterSecretStore — Vault backend ───────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.your-domain.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-production"
          serviceAccountRef:
            name: eso-vault-auth
            namespace: eso-production

---
# ── Database credentials ──────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-db-credentials
  namespace: eso-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: eso/production/database
        property: DATABASE_URL

---
# ── Auth0 credentials ─────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-auth0-credentials
  namespace: eso-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-auth0-credentials
    creationPolicy: Owner
  data:
    - secretKey: AUTH0_DOMAIN
      remoteRef:
        key: eso/production/auth0
        property: AUTH0_DOMAIN
    - secretKey: AUTH0_AUDIENCE
      remoteRef:
        key: eso/production/auth0
        property: AUTH0_AUDIENCE
    - secretKey: AUTH0_CLIENT_SECRET
      remoteRef:
        key: eso/production/auth0
        property: AUTH0_CLIENT_SECRET

---
# ── LLM (Anthropic) credentials ──────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
