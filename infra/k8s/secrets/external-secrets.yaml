  name: eso-llm-credentials
  namespace: eso-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-llm-credentials
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: eso/production/llm
        property: ANTHROPIC_API_KEY

---
# ── Kafka SASL credentials ────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-kafka-credentials
  namespace: eso-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: SASL_USERNAME
      remoteRef:
        key: eso/production/kafka
        property: SASL_USERNAME
    - secretKey: SASL_PASSWORD
      remoteRef:
        key: eso/production/kafka
        property: SASL_PASSWORD
    - secretKey: client-passwords
      remoteRef:
        key: eso/production/kafka
        property: SASL_PASSWORD
    - secretKey: inter-broker-password
      remoteRef:
        key: eso/production/kafka
        property: INTER_BROKER_PASSWORD

---
# ── PagerDuty keys ────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: eso-pagerduty-credentials
  namespace: eso-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: eso-pagerduty-credentials
    creationPolicy: Owner
  data:
    - secretKey: ESO_PD_CRITICAL_KEY
      remoteRef:
        key: eso/production/pagerduty
        property: CRITICAL_KEY
    - secretKey: ESO_PD_WARNING_KEY
      remoteRef:
        key: eso/production/pagerduty
        property: WARNING_KEY
