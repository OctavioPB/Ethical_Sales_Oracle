version: '3.9'

# ─────────────────────────────────────────────
# Ethical Sales Oracle — Local Dev Stack
# Services: Zookeeper · Kafka · Schema Registry
#           PostgreSQL (+ TimescaleDB) · Airflow
# ─────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__LOGGING__LOGGING_LEVEL: WARNING
    # ── ESO runtime config ────────────────────────────────────────────
    KAFKA_BROKERS: kafka:29092
    DATABASE_URL: postgresql://eso:eso_dev_secret@postgres:5432/eso
    STT_PROVIDER: whisper
    WHISPER_MODEL: large-v3
    SPACY_MODEL: en_core_web_lg
    # HF_TOKEN: <set via .env file — do not hardcode>
    # ── Python path: makes `from services.shared import ...` resolve ──
    PYTHONPATH: /opt/airflow
    # nlp-engine is added to sys.path inside the DAG file (hyphenated dir)
  volumes:
    - ../../infra/airflow/dags:/opt/airflow/dags
    # Mount the entire services directory so Airflow workers can import them
    - ../../services:/opt/airflow/services
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - ethical_sales_oracle-net

services:
  # ── Zookeeper ──────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ethical_sales_oracle-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - '2181:2181'
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2181']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethical_sales_oracle-net

  # ── Kafka Broker ───────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ethical_sales_oracle-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092' # external (host) access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:29092', '--list']
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ethical_sales_oracle-net

  # ── Schema Registry ────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: ethical_sales_oracle-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/subjects']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ethical_sales_oracle-net

  # ── Kafka Topic Initializer ─────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ethical_sales_oracle-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Creating ESO Kafka topics...' &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic eso.audio.eu.desk_001
          --partitions 6 --replication-factor 1
          --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic eso.audio.us.desk_001
          --partitions 6 --replication-factor 1
          --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic eso.events.risk
          --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic eso.scores.calls
          --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
          --topic eso.alerts.ops
          --partitions 1 --replication-factor 1 &&
        echo 'Topics created successfully.'
      "
    networks:
      - ethical_sales_oracle-net

  # ── PostgreSQL + TimescaleDB ────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ethical_sales_oracle-postgres
    environment:
      POSTGRES_USER: eso
      POSTGRES_PASSWORD: eso_dev_secret
      POSTGRES_DB: eso
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eso -d eso']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ethical_sales_oracle-net

  # ── Airflow: DB Init ───────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: ethical_sales_oracle-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@eso.local \
          --password admin
    environment:
      <<: *airflow-env
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    depends_on:
      postgres:
        condition: service_healthy

  # ── Airflow: Webserver ─────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: ethical_sales_oracle-airflow-webserver
    command: webserver
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Airflow: Scheduler ─────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: ethical_sales_oracle-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ── Kafka UI (dev convenience) ─────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ethical_sales_oracle-kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - '8082:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: ethical_sales_oracle-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    networks:
      - ethical_sales_oracle-net

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  postgres-data:
  airflow-logs:
  airflow-plugins:

networks:
  ethical_sales_oracle-net:
    driver: bridge
