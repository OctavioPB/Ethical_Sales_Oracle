name: eso

# ─────────────────────────────────────────────────────────────────────────────
# Ethical Sales Oracle — Full Dev Stack
#
# Usage:
#   docker compose up -d            # start everything
#   docker compose up -d --build    # rebuild api/dashboard images
#   docker compose logs -f api      # tail a service
#   docker compose down             # stop (keeps volumes)
#   docker compose down -v          # stop and wipe all data
#
# Optional services (add --profile <name>):
#   --profile airflow               Airflow webserver + scheduler
#   --profile extras                Schema Registry + Kafka UI
#
# Ports:
#   5173  Dashboard
#   3001  API (REST + WebSocket)
#   5432  PostgreSQL
#   9092  Kafka
#   8080  Airflow  (--profile airflow)
#   8081  Schema Registry  (--profile extras)
#   8082  Kafka UI  (--profile extras)
# ─────────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__LOGGING__LOGGING_LEVEL: WARNING
    KAFKA_BROKERS: kafka:29092
    DATABASE_URL: postgresql://eso:eso_dev_secret@postgres:5432/eso
    STT_PROVIDER: whisper
    WHISPER_MODEL: large-v3
    SPACY_MODEL: en_core_web_lg
    PYTHONPATH: /opt/airflow
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags
    - ./services:/opt/airflow/services
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - eso-net

services:
  # ── PostgreSQL + TimescaleDB ────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: eso-postgres
    environment:
      POSTGRES_USER: eso
      POSTGRES_PASSWORD: eso_dev_secret
      POSTGRES_DB: eso
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eso -d eso']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eso-net

  # ── Kafka ───────────────────────────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: eso-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '2181']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eso-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eso-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:29092', '--list']
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - eso-net

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eso-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eso.scores.calls --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eso.events.risk  --partitions 3 --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eso.audio.eu.desk_001 --partitions 6 --replication-factor 1 --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eso.audio.us.desk_001 --partitions 6 --replication-factor 1 --config retention.ms=86400000 &&
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic eso.alerts.ops --partitions 1 --replication-factor 1 &&
        echo 'Kafka topics ready.'
      "
    networks:
      - eso-net

  # ── API ─────────────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.dev
    image: eso-api:dev
    container_name: eso-api
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: development
      PORT: 3001
      CLIENT_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://eso:eso_dev_secret@postgres:5432/eso
      KAFKA_BROKERS: kafka:29092
      # Auth0 — leave blank to use demo mode (no Auth0 account needed)
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      # Force polling so tsx watch detects changes on Windows/WSL bind mounts
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./api/src:/app/api/src
      - api-node-modules:/app/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - eso-net

  # ── Dashboard ───────────────────────────────────────────────────────────────

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile.dev
    image: eso-dashboard:dev
    container_name: eso-dashboard
    ports:
      - '5173:5173'
    environment:
      # Vite proxy target — points to the api service inside the Docker network
      API_TARGET: http://api:3001
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./dashboard/src:/app/dashboard/src
      - dashboard-node-modules:/app/dashboard/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - eso-net

  # ── Optional: Schema Registry (--profile extras) ────────────────────────────

  schema-registry:
    profiles: [extras]
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: eso-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - eso-net

  # ── Optional: Kafka UI (--profile extras) ───────────────────────────────────

  kafka-ui:
    profiles: [extras]
    image: provectuslabs/kafka-ui:latest
    container_name: eso-kafka-ui
    depends_on:
      - kafka
    ports:
      - '8082:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: eso-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - eso-net

  # ── Optional: Airflow (--profile airflow) ───────────────────────────────────

  airflow-init:
    profiles: [airflow]
    <<: *airflow-common
    container_name: eso-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade &&
        airflow users create \
          --username admin --firstname Admin --lastname User \
          --role Admin --email admin@eso.local --password admin

  airflow-webserver:
    profiles: [airflow]
    <<: *airflow-common
    container_name: eso-airflow-webserver
    command: webserver
    ports:
      - '8080:8080'
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    profiles: [airflow]
    <<: *airflow-common
    container_name: eso-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  airflow-logs:
  airflow-plugins:
  api-node-modules:
  dashboard-node-modules:

networks:
  eso-net:
    driver: bridge
