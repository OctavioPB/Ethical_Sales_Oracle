# Bitnami Kafka Helm chart values — ESO production
# Chart: https://github.com/bitnami/charts/tree/main/bitnami/kafka
# Install:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm upgrade --install eso-kafka bitnami/kafka \
#     -n eso-production -f infra/k8s/kafka/helm-values.yaml

image:
  tag: "3.7.0"

# ── Cluster topology ──────────────────────────────────────────────────────────

# KRaft mode (no ZooKeeper) — Kafka 3.3+
kraft:
  enabled: true

controller:
  replicaCount: 3
  persistence:
    enabled: true
    size: 100Gi
    storageClass: gp3  # AWS EBS gp3; adjust for your cloud provider

broker:
  replicaCount: 0  # KRaft combines controller + broker roles in controller nodes

# ── Topic defaults ─────────────────────────────────────────────────────────────

defaultReplicationFactor: 3
offsetsTopicReplicationFactor: 3
transactionStateLogReplicationFactor: 3
transactionStateLogMinIsr: 2
minInsyncReplicas: 2

# ── Authentication (SASL/SCRAM-SHA-512) ──────────────────────────────────────

auth:
  clientProtocol: sasl
  interBrokerProtocol: sasl
  sasl:
    mechanisms: scram-sha-512
    interBrokerMechanism: scram-sha-512
    # Credentials are provided via an existing Secret; do not inline here.
    # Secret must exist before helm install:
    #   kubectl create secret generic eso-kafka-credentials \
    #     --from-literal=client-passwords=<password> \
    #     --from-literal=inter-broker-password=<password> \
    #     -n eso-production
    existingSecret: eso-kafka-credentials
    existingSecretClientPasswordKey: client-passwords
    existingSecretInterBrokerPasswordKey: inter-broker-password

tls:
  enabled: true
  existingSecret: eso-kafka-tls

# ── Retention and performance ─────────────────────────────────────────────────

config: |
  log.retention.hours=168
  log.segment.bytes=1073741824
  auto.create.topics.enable=false
  compression.type=lz4
  message.max.bytes=10485760

extraConfig: |
  # Audio topic: 2.5-day retention (audio_purged after 30 days via DAG)
  # Override per-topic via kafka-topics.sh --alter

# ── Metrics ───────────────────────────────────────────────────────────────────

metrics:
  kafka:
    enabled: true
  jmx:
    enabled: true

# ── Anti-affinity (spread brokers across availability zones) ─────────────────

controller:
  podAntiAffinityPreset: hard

# ── Resource requests ─────────────────────────────────────────────────────────

controller:
  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  jvmOptions:
    maxHeapSize: "2G"
    minHeapSize: "1G"

# ── Provisioning — topics created on first install ────────────────────────────

provisioning:
  enabled: true
  topics:
    - name: eso.audio.eu.desk_001
      partitions: 6
      replicationFactor: 3
      config:
        retention.ms: "2592000000"  # 30 days
    - name: eso.audio.us.desk_001
      partitions: 6
      replicationFactor: 3
      config:
        retention.ms: "2592000000"
    - name: eso.events.risk
      partitions: 6
      replicationFactor: 3
    - name: eso.scores.calls
      partitions: 6
      replicationFactor: 3
    - name: eso.alerts.ops
      partitions: 3
      replicationFactor: 3
    - name: eso.retention.audio-purge
      partitions: 3
      replicationFactor: 3
