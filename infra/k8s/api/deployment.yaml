apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-api
  namespace: eso-production
  labels:
    app: eso-api
    app.kubernetes.io/part-of: ethical-sales-oracle
spec:
  # Replica count is managed by HPA (api/hpa.yaml); this sets the initial floor.
  replicas: 2
  selector:
    matchLabels:
      app: eso-api
  strategy:
    # Rollout is managed by Argo Rollouts (api/rollout.yaml) for blue/green.
    # This plain Deployment is retained for kubectl apply bootstrapping;
    # the Argo Rollout object takes over once the controller is installed.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eso-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3001"
    spec:
      serviceAccountName: eso-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/your-org/eso-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: production
            - name: CLIENT_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: eso-config
                  key: DASHBOARD_ORIGIN
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: eso-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CONSUMER_GROUP
              value: eso-api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eso-db-credentials
                  key: DATABASE_URL
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: eso-auth0-credentials
                  key: AUTH0_DOMAIN
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: eso-auth0-credentials
                  key: AUTH0_AUDIENCE
            - name: DB_POOL_MAX
              value: "10"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 2
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: eso-api
                topologyKey: kubernetes.io/hostname
