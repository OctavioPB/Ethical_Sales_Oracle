apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-dashboard
  namespace: eso-production
  labels:
    app: eso-dashboard
    app.kubernetes.io/part-of: ethical-sales-oracle
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eso-dashboard
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: eso-dashboard
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: dashboard
          # Static React build served by nginx
          image: ghcr.io/your-org/eso-dashboard:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          env:
            - name: VITE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: eso-config
                  key: API_URL
            - name: VITE_WS_URL
              valueFrom:
                configMapKeyRef:
                  name: eso-config
                  key: WS_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
