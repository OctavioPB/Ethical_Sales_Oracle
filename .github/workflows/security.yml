name: Security Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run daily at 06:00 UTC to catch newly published CVEs
    - cron: "0 6 * * *"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets scan (Gitleaks) ─────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan — Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for pre-commit mode

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml

  # ── Node.js dependency audit ────────────────────────────────────────────────
  node-audit:
    name: Dependency Audit — pnpm (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (high + critical)
        # --audit-level=high fails on high or critical vulnerabilities only.
        # Moderate findings are tracked in the backlog but don't block CI.
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Upload audit report
        if: always()
        run: pnpm audit --json > audit-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-audit-report
          path: audit-report.json
          retention-days: 30

  # ── Python dependency audit (safety) ───────────────────────────────────────
  python-audit:
    name: Dependency Audit — pip (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install safety
        run: pip install safety==3.2.4

      - name: Run safety check
        run: safety check -r requirements-dev.txt --full-report
        continue-on-error: false

  # ── Static Application Security Testing (Semgrep) ──────────────────────────
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          # OWASP Top 10, injection, XSS, command injection, path traversal
          config: >-
            p/owasp-top-ten
            p/javascript
            p/typescript
            p/python
            p/express-security
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # ── Docker image scan (Trivy) ───────────────────────────────────────────────
  container-scan:
    name: Container Scan — Trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build API image for scanning
        run: docker build -t eso-api:scan ./api

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "eso-api:scan"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ── Security gate ───────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - node-audit
      - python-audit
      - sast
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          if [[ "${{ needs.secrets-scan.result }}" != "success" ||
                "${{ needs.node-audit.result }}" != "success" ||
                "${{ needs.python-audit.result }}" != "success" ||
                "${{ needs.sast.result }}" != "success" ]]; then
            echo "One or more security checks failed."
            exit 1
          fi
          echo "All security checks passed."
