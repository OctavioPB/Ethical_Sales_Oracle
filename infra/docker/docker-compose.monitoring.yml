version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# ESO Monitoring Stack — Prometheus · Alertmanager · Grafana · Exporters
#
# Usage (extend the main stack):
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Ports:
#   9090  Prometheus
#   9093  Alertmanager
#   3000  Grafana
#   9308  kafka-exporter
#   9187  postgres-exporter
# ─────────────────────────────────────────────────────────────────────────────

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: eso-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - eso-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: eso-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    environment:
      ESO_PD_CRITICAL_KEY: "${ESO_PD_CRITICAL_KEY:-}"
      ESO_PD_WARNING_KEY:  "${ESO_PD_WARNING_KEY:-}"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - eso-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: eso-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-eso_grafana_dev}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/eso-pipeline.json
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    networks:
      - eso-net
    depends_on:
      - prometheus
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: eso-kafka-exporter
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:29092"
      - "--group.filter=eso-.*"
      - "--topic.filter=eso\\..*"
    networks:
      - eso-net
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: eso-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://eso:eso_dev_secret@postgres:5432/eso?sslmode=disable"
    networks:
      - eso-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  eso-net:
    external: true
    name: docker_eso-net
